<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="estilo.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cadastro</title>
    <script src="codigo.js"></script>
</head>
<body>
    
        <form>

            <input type="text" name="nome" id="preencher" placeholder="Nome Completo">
        
 
            <input type="email" name="email" id="preencher" placeholder="E-mail">
        
      
            <input type="tel" name="telefone"  id= "preencher" placeholder="Telefone">
        
           
            <input type="text" name="nome_mae"  id= "preencher" placeholder="Nome da Mãe">
        
   
            <input type="text" name="nome_pai" id = "preencher" placeholder="Nome do Pai">
        
    
            <input type="text" name="endereco" id="preencher" placeholder="Endereço (Rua/Avenida)">
        
            
            <input type="text" name="numero" id= "preencher" placeholder="Número">
        
           
            <input type="text" name="cidade" id= "preencher" placeholder="Cidade">
        
           
            <input type="text" name="estado" id= "preencher" placeholder="Estado">
        
            <input type="text" name="pais" id="preencher" placeholder="País">
        
     <label for="situacao_em">concluiu o ensino medio</label>
            <input type="radio" name="situacao_em" id= "preencher"value="concluido"> Já concluí
            <input type="radio" name="situacao_em"  id= "preencher"value="cursando"> Estou cursando
        
     <label for="tipo_escola">Tipo de escola</label>   
            <input type="radio" name="tipo_escola" id= "preencher"value="publica"> Pública
            <input type="radio" name="tipo_escola" id= "preencher"value="privada"> Privada
        
          
            <input type="password" name="senha" id="senha" placeholder="Senha">
        
            <input type="password" name="confirmar_senha"  id= "senha"placeholder="Confirmar Senha">

            <button onclick="salvar(event)">salvar inscrição</button>

            <button onclick="voltar()">Voltar</button>

            <p id="mensagem"></p>
        </form>

       
    
    
</body>
</html>
