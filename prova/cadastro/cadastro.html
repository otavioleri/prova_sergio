<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="estilo.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cadastro</title>
    <script src="codigo.js"></script>
</head>
<body>
    
        <form>

            <input type="text" name="nome" placeholder="Nome Completo">
        
 
            <input type="email" name="email" placeholder="E-mail">
        
      
            <input type="tel" name="telefone" placeholder="Telefone">
        
           
            <input type="text" name="nome_mae" placeholder="Nome da Mãe">
        
   
            <input type="text" name="nome_pai" placeholder="Nome do Pai">
        
    
            <input type="text" name="endereco" placeholder="Endereço (Rua/Avenida)">
        
            
            <input type="text" name="numero" placeholder="Número">
        
           
            <input type="text" name="cidade" placeholder="Cidade">
        
           
            <input type="text" name="estado" placeholder="Estado">
        
            <input type="text" name="pais" placeholder="País">
        
     <label for="situacao_em">concluiu o ensino medio</label>
            <input type="radio" name="situacao_em" value="concluido"> Já concluí
            <input type="radio" name="situacao_em" value="cursando"> Estou cursando
        
     <label for="tipo_escola">Tipo de escola</label>   
            <input type="radio" name="tipo_escola" value="publica"> Pública
            <input type="radio" name="tipo_escola" value="privada"> Privada
        
          
            <input type="password" name="senha" placeholder="Senha">
        
            <input type="password" name="confirmar_senha" placeholder="Confirmar Senha">

            <button onclick="salvar(event)">salvar inscrição</button>

            <button onclick="voltar()">Voltar</button>

            <p id="mensagem"></p>
        </form>

       
    
    
</body>
</html>
